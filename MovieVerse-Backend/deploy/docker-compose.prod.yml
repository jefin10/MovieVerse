# MovieVerse on a single server: the API, Postgres and the AI service.
# Secrets and settings live in .env beside this file on the server, never in
# the repo. Images are built on a developer machine and loaded (see deploy.sh).
name: movieverse

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: movieverse
      POSTGRES_USER: movieverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U movieverse']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  ai:
    image: movieverse-ai:latest
    restart: unless-stopped
    environment:
      PORT: 5001
      MODEL_DIR: /model
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./model:/model:ro
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  backend:
    image: movieverse-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://movieverse:${POSTGRES_PASSWORD}@db:5432/movieverse?schema=public
      AI_SERVICE_URL: http://ai:5001
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    # Loopback only: the HTTPS proxy on the server is the way in.
    ports:
      - '${BACKEND_BIND:-127.0.0.1:8080}:8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

volumes:
  pgdata:
